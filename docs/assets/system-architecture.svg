<circle cx="95" cy="1221" r="5" fill="#d0e79b"/><text class="note" x="113" y="1228">Versioned tactical reference grounds options and Jev</text>
<circle cx="792" cy="1221" r="5" fill="#d7b9eb"/><text class="note" x="810" y="1228">SQLite caches Jev calls and enforces API budget</text>
